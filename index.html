<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

    <!-- Main Card Container -->
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Create an Account</h1>
            <p class="text-sm text-gray-500 mt-2">Sign up to get started</p>
        </div>

        <!-- Notification Area (Hidden by default) -->
        <div id="notification" class="hidden w-full p-3 mb-6 rounded-md text-sm font-medium text-center transition-all duration-300">
        </div>

        <!-- Registration Form -->
        <form id="registerForm" class="space-y-5">
            
            <!-- Username Field -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    placeholder="johndoe"
                >
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    placeholder="john@example.com"
                >
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    minlength="6"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    placeholder="••••••••"
                >
            </div>

            <!-- Confirm Password Field -->
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    required 
                    minlength="6"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    placeholder="••••••••"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all duration-200 mt-2"
            >
                Register
            </button>
        </form>

        <!-- Footer link -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Already have an account? <a href="#" class="text-blue-600 hover:underline font-medium hover:text-blue-800 transition-colors">Sign in</a>
        </p>
    </div>

    <!-- JavaScript for Form Validation & Submission -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            // Prevent the default form submission (page reload)
            event.preventDefault();

            // Get the form values
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Get the notification element
            const notification = document.getElementById('notification');

            // Reset notification styles
            notification.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');

            // Basic Validation: Check if passwords match
            if (password !== confirmPassword) {
                notification.textContent = 'Passwords do not match. Please try again.';
                notification.classList.add('bg-red-100', 'text-red-700');
                return;
            }

            // Simulate successful registration
            // In a real application, you would send this data to a server here via fetch() or XMLHttpRequest
            notification.textContent = `Registration successful! Welcome, ${username}.`;
            notification.classList.add('bg-green-100', 'text-green-700');
            
            // Clear the form fields after successful registration
            this.reset();
            
            // Automatically hide the success message after 5 seconds
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 5000);
        });
    </script>
</body>
</html>
